<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Burn</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <header>
            <h1>🔥 Credit Burn 🔥</h1>
            <p>A silly game of burning credits. A user tips, then the owner must match. 50% of every tip is burned, 50% goes to the project owner.</p>
            <div id="total-stats">
                <!-- Totals will be rendered here by script.js -->
            </div>
        </header>

        <div id="game-state">
            <div id="status-indicator">
                <div class="spinner"></div>
                <span id="status-text">Initializing...</span>
            </div>
            <div id="last-tip-info"></div>
        </div>
        
        <div id="action-area">
             <div id="action-header"></div>
            <textarea id="comment-input" placeholder="Add a message to your burn... (optional)"></textarea>
            <button id="burn-button" disabled>
                <span class="button-icon">🔥</span>
                <span class="button-text">Burn Credits</span>
            </button>
            <p id="action-error" class="error-message"></p>
        </div>

        <div id="burn-history">
            <h2>Burn History</h2>
            <div id="comments-container">
                <p>Loading history...</p>
            </div>
        </div>

        <footer>
            <p>Made with the Websim Comments API</p>
        </footer>
    </div>

    <script type="importmap">
      {
        "imports": {
          "marked": "https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js",
          "dompurify": "https://cdn.jsdelivr.net/npm/dompurify/dist/purify.es.min.js"
        }
      }
    </script>
    <script type="module" src="script.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
